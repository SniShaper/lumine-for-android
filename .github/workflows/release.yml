name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_API_LEVEL: '36'
      GOMOBILE_ANDROID_API: '24'
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_NDK_VERSION: '30.0.14904198'
      RELEASE_APK_GLOB: android/app/build/outputs/apk/release/*.apk
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: enimul/go.mod
          cache-dependency-path: |
            enimul/go.sum
            tun2socks/go.sum
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Resolve Android environment
        id: sdk-env
        shell: bash
        run: |
          if [[ -n "${ANDROID_SDK_ROOT:-}" && -z "${ANDROID_HOME:-}" ]]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          elif [[ -n "${ANDROID_HOME:-}" && -z "${ANDROID_SDK_ROOT:-}" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -n "$sdk_root" ]]; then
            echo "ANDROID_NDK_HOME=$sdk_root/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
            echo "NDK_HOME=$sdk_root/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          fi
          echo "sdk_root=$sdk_root" >> "$GITHUB_OUTPUT"

      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.sdk-env.outputs.sdk_root }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ndk-${{ env.ANDROID_NDK_VERSION }}-v1

      - name: Install Android packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Cache Gradle build-cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ hashFiles('android/**/*.gradle', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-build-cache-

      - name: Cache gomobile bind output
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/gomobile
            ~/go/pkg/android_arm64
            ~/go/pkg/android_arm
            ~/go/pkg/android_386
            ~/go/pkg/android_amd64
          key: gomobile-${{ hashFiles('enimul/go.sum', 'tun2socks/go.sum') }}-v1
          restore-keys: |
            gomobile-

      - name: Prepare Go mobile toolchain
        shell: bash
        env:
          GOFLAGS: -mod=mod
        run: |
          GOBIN="$(go env GOPATH)/bin"
          echo "$GOBIN" >> "$GITHUB_PATH"
          export PATH="$GOBIN:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build Android core AAR
        working-directory: enimul
        shell: bash
        env:
          GOFLAGS: -mod=mod
        run: |
          mkdir -p ../android/app/libs
          gomobile bind \
            -target=android \
            -androidapi "${GOMOBILE_ANDROID_API}" \
            -o ../android/app/libs/LumineCore.aar \
            -ldflags="-s -w -buildid=" -trimpath \
            ./mobile

      - name: Prepare signing keystore
        if: env.HAS_ANDROID_KEYSTORE != ''
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Build release APKs
        shell: bash
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x test -x androidTest

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="$VERSION"
          title="$VERSION"

          mkdir -p release-assets
          shopt -s nullglob
          release_apks=(${{ env.RELEASE_APK_GLOB }})
          if [[ ${#release_apks[@]} -eq 0 ]]; then
            echo "Release APKs not found"
            exit 1
          fi
          for release_apk in "${release_apks[@]}"; do
            base_name="$(basename "$release_apk")"
            cp "$release_apk" "release-assets/lumine-${tag}-${base_name}"
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --title "$title" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
