// android/settings.gradle
rootProject.name = "LumineAndroid"

pluginManagement {
    repositories {
        // 优先使用腾讯云镜像以提高国内 CI/Runner 的依赖可用性
        maven { url 'https://mirrors.tencent.com/nexus/repository/google/' }
        maven { url 'https://mirrors.tencent.com/nexus/repository/maven-central/' }

        // 保留常用仓库作为后备
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    // 让 settings 中的仓库优先生效
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        // 优先使用腾讯云镜像
        maven { url 'https://mirrors.tencent.com/nexus/repository/google/' }
        maven { url 'https://mirrors.tencent.com/nexus/repository/maven-central/' }

        // 官方仓库作为后备
        google()
        mavenCentral()

        // 若项目使用 jitpack，保留它
        maven { url 'https://jitpack.io' }
    }
}

include ':app'
