name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        type: string
      version_code:
        description: 'Optional version code override (defaults to major*10000 + minor*100 + patch)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_API_LEVEL: '37'
      GOMOBILE_ANDROID_API: '24'
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_NDK_VERSION: '30.0.14904198'
      RELEASE_APK_GLOB: android/app/build/outputs/apk/release/*.apk
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_BOT_NAME: SnishaperTeam-ReleaseBot

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: enimul/go.mod
          cache-dependency-path: |
            enimul/go.sum
            tun2socks/go.sum
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Resolve Android environment
        id: sdk-env
        shell: bash
        run: |
          if [[ -n "${ANDROID_SDK_ROOT:-}" && -z "${ANDROID_HOME:-}" ]]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          elif [[ -n "${ANDROID_HOME:-}" && -z "${ANDROID_SDK_ROOT:-}" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -n "$sdk_root" ]]; then
            echo "ANDROID_NDK_HOME=$sdk_root/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
            echo "NDK_HOME=$sdk_root/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          fi
          echo "sdk_root=$sdk_root" >> "$GITHUB_OUTPUT"

      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.sdk-env.outputs.sdk_root }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ndk-${{ env.ANDROID_NDK_VERSION }}-v1

      - name: Install Android packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platforms;android-37.2" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Probe Maven repository latency
        shell: bash
        run: |
          bash scripts/probe-repos.sh
          mkdir -p ~/.gradle/init.d
          cp scripts/repo-order.init.gradle ~/.gradle/init.d/

      - name: Cache Gradle build-cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ hashFiles('android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-build-cache-

      - name: Cache gomobile bind output
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/gomobile
            ~/go/pkg/android_arm64
            ~/go/pkg/android_arm
            ~/go/pkg/android_386
            ~/go/pkg/android_amd64
          key: gomobile-${{ hashFiles('enimul/go.sum', 'tun2socks/go.sum') }}-v1
          restore-keys: |
            gomobile-

      - name: Prepare Go mobile toolchain
        shell: bash
        env:
          GOFLAGS: -mod=mod
        run: |
          GOBIN="$(go env GOPATH)/bin"
          echo "$GOBIN" >> "$GITHUB_PATH"
          export PATH="$GOBIN:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build Android core AAR
        working-directory: enimul
        shell: bash
        env:
          GOFLAGS: -mod=mod
        run: |
          mkdir -p ../android/app/libs
          gomobile bind \
            -target=android \
            -androidapi "${GOMOBILE_ANDROID_API}" \
            -o ../android/app/libs/LumineCore.aar \
            -ldflags="-s -w -buildid=" -trimpath \
            ./mobile

      - name: Prepare signing keystore
        if: env.HAS_ANDROID_KEYSTORE != ''
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Resolve release version
        id: version-info
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
          RAW_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          name="${RAW_VERSION#v}"
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like v1.2.3 or 1.2.3, got: $RAW_VERSION"
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$name"

          if [[ -n "$RAW_VERSION_CODE" ]]; then
            code="$RAW_VERSION_CODE"
          else
            code=$(( major * 10000 + minor * 100 + patch ))
          fi

          if [[ ! "$code" =~ ^[0-9]+$ ]] || (( code < 1 )); then
            echo "Invalid version code: $code"
            exit 1
          fi

          tag="v$name"
          latest_tag="$(git tag --sort=-v:refname | head -1 || true)"
          if [[ -n "$latest_tag" ]]; then
            latest_name="${latest_tag#v}"
            if [[ "$latest_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              IFS='.' read -r latest_major latest_minor latest_patch <<< "$latest_name"
              latest_code=$(( latest_major * 10000 + latest_minor * 100 + latest_patch ))
              if (( code <= latest_code )); then
                echo "Refusing to publish: version code $code from $name is not greater than $latest_code from $latest_tag"
                exit 1
              fi
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Resolved $tag: versionName=$name versionCode=$code (latest tag: ${latest_tag:-none})"

      - name: Inject and commit release version
        id: bump
        shell: bash
        env:
          RELEASE_NAME: ${{ steps.version-info.outputs.name }}
          RELEASE_CODE: ${{ steps.version-info.outputs.code }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sed -i -E "s/^([[:space:]]*)versionCode[[:space:]]+[0-9]+$/\1versionCode ${RELEASE_CODE}/" android/app/build.gradle
          sed -i -E "s/^([[:space:]]*)versionName[[:space:]]+\"[0-9.]+\"$/\1versionName \"${RELEASE_NAME}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle | head -4

          if ! grep -qE "versionCode ${RELEASE_CODE}$" android/app/build.gradle; then
            echo "Failed to inject versionCode into android/app/build.gradle"
            exit 1
          fi
          if ! grep -qE "versionName \"${RELEASE_NAME}\"$" android/app/build.gradle; then
            echo "Failed to inject versionName into android/app/build.gradle"
            exit 1
          fi

          if git diff --quiet -- android/app/build.gradle; then
            echo "Version already matches v${RELEASE_NAME}, no commit needed"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "$RELEASE_BOT_NAME"
          git config user.email "${RELEASE_BOT_NAME}@users.noreply.github.com"
          echo "::notice::committing as $RELEASE_BOT_NAME"
          git add android/app/build.gradle
          git commit -m "chore(release): v${RELEASE_NAME}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

          head_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/${DEFAULT_BRANCH}" | cut -f1)"
          if [[ "$head_sha" != "$remote_sha" ]]; then
            echo "Version commit was not pushed to ${DEFAULT_BRANCH} (local ${head_sha}, remote ${remote_sha})"
            exit 1
          fi
          echo "Pushed version commit ${head_sha} to ${DEFAULT_BRANCH}"
          echo "sha=${head_sha}" >> "$GITHUB_OUTPUT"

      - name: Build release APKs
        shell: bash
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x test -x connectedAndroidTest

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version-info.outputs.tag }}
          RELEASE_SHA: ${{ steps.bump.outputs.sha }}
        run: |
          tag="$VERSION"
          title="$VERSION"

          mkdir -p release-assets
          shopt -s nullglob
          release_apks=(${{ env.RELEASE_APK_GLOB }})
          if [[ ${#release_apks[@]} -eq 0 ]]; then
            echo "Release APKs not found"
            exit 1
          fi
          for release_apk in "${release_apks[@]}"; do
            base_name="$(basename "$release_apk")"
            cp "$release_apk" "release-assets/lumine-${tag}-${base_name}"
          done

          previous_tag="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          if [[ "$previous_tag" == "$tag" ]]; then
            previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          fi
          range="${previous_tag:+${previous_tag}..}HEAD"

          body_file="$(mktemp)"
          {
            echo "## What's Changed"
            echo
            while IFS=$'\t' read -r sha subject; do
              login="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" --jq '.author.login // empty' 2>/dev/null || true)"
              pr_url="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" --jq '.[0].html_url // empty' 2>/dev/null || true)"
              if [[ -z "$pr_url" ]]; then
                pr_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${sha}"
              fi
              if [[ -z "$login" ]]; then
                login="$(git show -s --pretty='%an' "$sha")"
              fi
              printf '* %s by @%s in %s\n' "$subject" "$login" "$pr_url"
            done < <(git log --no-merges --reverse --pretty='%H%x09%s' $range)
            echo
            echo "## Contributors"
            echo
            git log --no-merges --pretty='%an' $range | sort | uniq -c | sort -rn |
              awk '{ count = $1; $1 = ""; sub(/^ /, ""); printf "- %s (%d commits)\n", $0, count }'
          } > "$body_file" || true

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" --notes-file "$body_file"
          else
            gh release create "$tag" release-assets/* \
              --title "$title" \
              --notes-file "$body_file" \
              --target "$RELEASE_SHA"
          fi
          rm -f "$body_file"
