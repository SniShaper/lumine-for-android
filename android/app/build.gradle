import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def envOrProp = { String name ->
    def envValue = System.getenv(name)
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue
    }
    def propValue = project.findProperty(name)
    return propValue == null ? null : propValue.toString()
}

def releaseKeystorePath = envOrProp('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = envOrProp('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = envOrProp('ANDROID_KEY_ALIAS')
def releaseKeyPassword = envOrProp('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath != null &&
        file(releaseKeystorePath).exists() &&
        releaseStorePassword != null &&
        releaseKeyAlias != null &&
        releaseKeyPassword != null

android {
    namespace 'com.moi.lumine'
    compileSdk 36

    splits {
        abi {
            enable true
            reset()
            if (project.hasProperty("ABI_FILTER")) {
                include(ABI_FILTER)
            } else {
                def isRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
                if (isRelease) {
                    include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
                } else {
                    include 'arm64-v8a'
                }
            }
            universalApk false
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.moi.lumine"
        minSdk 24
        targetSdk 36
        versionCode 19
        versionName "0.8.1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        compose true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle false
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_1_8)
    }
}

ext.abiCodes = [ "armeabi-v7a": 1, "arm64-v8a": 2, "x86": 3, "x86_64": 4 ]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'com.google.android.material:material:1.14.0'
    
    // Background keep-alive
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    
    // JSON & Networking
    implementation "com.squareup.moshi:moshi-kotlin:1.15.2"
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.4.10"
    
    // Lifecycle & Navigation
    implementation "androidx.navigation:navigation-compose:2.9.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"

    // Gomobile generated AAR
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
