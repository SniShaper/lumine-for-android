name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_API_LEVEL: '36'
      GOMOBILE_ANDROID_API: '24'
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_NDK_VERSION: '30.0.14904198'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: enimul/go.mod
          cache-dependency-path: |
            enimul/go.sum
            tun2socks/go.sum
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Resolve Android environment
        id: sdk-env
        shell: bash
        run: |
          if [[ -n "${ANDROID_SDK_ROOT:-}" && -z "${ANDROID_HOME:-}" ]]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          elif [[ -n "${ANDROID_HOME:-}" && -z "${ANDROID_SDK_ROOT:-}" ]]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -n "$sdk_root" ]]; then
            echo "ANDROID_NDK_HOME=$sdk_root/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
            echo "NDK_HOME=$sdk_root/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          fi
          echo "sdk_root=$sdk_root" >> "$GITHUB_OUTPUT"

      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.sdk-env.outputs.sdk_root }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ndk-${{ env.ANDROID_NDK_VERSION }}-v1

      - name: Install Android packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Cache Gradle build-cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ hashFiles('android/**/*.gradle', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-build-cache-

      - name: Cache gomobile bind output
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/gomobile
            ~/go/pkg/android_arm64
          key: gomobile-${{ hashFiles('enimul/go.sum', 'tun2socks/go.sum') }}-v1
          restore-keys: |
            gomobile-

      - name: Prepare Go mobile toolchain
        shell: bash
        env:
          GOFLAGS: -mod=mod
        run: |
          GOBIN="$(go env GOPATH)/bin"
          echo "$GOBIN" >> "$GITHUB_PATH"
          export PATH="$GOBIN:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build Android core AAR + Vet Go modules
        working-directory: enimul
        shell: bash
        env:
          GOFLAGS: -mod=mod
        run: |
          # Run vet in background — it doesn't depend on AAR
          (cd ../tun2socks && go vet ./...) &

          # Build AAR — only arm64 for CI debug (4x faster than all ABIs)
          mkdir -p ../android/app/libs
          gomobile bind \
            -target=android/arm64 \
            -androidapi "${GOMOBILE_ANDROID_API}" \
            -o ../android/app/libs/LumineCore.aar \
            -ldflags="-s -w -buildid=" -trimpath \
            ./mobile

          # Wait for background vet to finish
          wait

      - name: Build debug APK
        shell: bash
        working-directory: android
        env:
          ABI_FILTER: arm64-v8a
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x test -x androidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lumine-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
          retention-days: 7
